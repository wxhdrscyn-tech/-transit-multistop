<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>多段公交路线</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f7f9;color:#16181d}.app{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 4px 20px #00000012;margin-bottom:12px}h1{font-size:22px;margin:0 0 4px}.sub{font-size:13px;color:#6d727b;margin-bottom:14px}.row{display:flex;gap:8px;align-items:center;margin:9px 0}.dot{width:11px;height:11px;border-radius:50%;background:#2774ff;flex:none}.dot.mid{background:#f3a400}.dot.end{background:#e43d30}input,select,button{font:inherit}input,select{width:100%;border:1px solid #d9dde5;border-radius:12px;padding:12px;background:#fff}button{border:0;border-radius:12px;padding:11px 14px;background:#16181d;color:white;font-weight:600}.secondary{background:#eef1f5;color:#16181d}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1}#map{height:52vh;min-height:360px;border-radius:18px;overflow:hidden}.stop{position:relative}.remove{flex:0 0 auto;width:42px;background:#eef1f5;color:#b3261e}.result{font-size:14px;line-height:1.45}.leg{padding:10px 0;border-top:1px solid #eee}.badge{display:inline-block;padding:3px 7px;border-radius:8px;background:#eef1f5;margin-right:5px;font-size:12px}.hint{font-size:12px;color:#727780;margin-top:10px}.status{font-size:13px;color:#555;margin-top:8px}
</style></head>
<body><div class="app">
<div class="card"><h1>多段公交路线</h1><div class="sub">A → B → C，每一段分别规划，再合并到同一张地图。</div>
<div id="stops"></div>
<div class="actions"><button class="secondary" id="add">＋ 添加途经点</button><button id="plan">生成路线</button></div>
<div class="hint">地点搜索使用 OpenStreetMap。升级版：支持公共交通多段串联、出发时间和每站停留时间。实际 TTC 路由可连接你自己的 OpenTripPlanner；演示模式无需服务器。</div>
<div class="row"><select id="mode"><option value="demo">演示模式（直线连接）</option><option value="otp">真实公共交通（OpenTripPlanner）</option></select></div><div class="row"><input id="depart" type="datetime-local"/><input id="dwell" type="number" min="0" value="5" placeholder="途经点停留分钟"/></div>
<div class="row"><input id="otp" placeholder="OTP GraphQL 地址，例如 https://…/otp/gtfs/v1"/></div><div class="status" id="status"></div></div>
<div class="card result" id="result">输入至少 3 个地点，然后生成路线。</div><div id="map"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map').setView([43.72,-79.42],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);
let layers=[];const stopsEl=document.getElementById('stops');
function stopRow(label,kind='mid'){const d=document.createElement('div');d.className='row stop';d.innerHTML=`<span class="dot ${kind}"></span><input placeholder="${label}"/>${kind==='mid'?'<button class="remove">×</button>':''}`;if(kind==='mid')d.querySelector('.remove').onclick=()=>d.remove();return d}
function resetStops(){stopsEl.innerHTML='';stopsEl.append(stopRow('起点 A',''));stopsEl.append(stopRow('途经点 B','mid'));stopsEl.append(stopRow('终点 C','end'))}resetStops();
document.getElementById('add').onclick=()=>{const end=stopsEl.lastElementChild;stopsEl.insertBefore(stopRow('途经点','mid'),end)};
async function geocode(q){const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q),{headers:{'Accept-Language':'zh-CN,en'}});const j=await r.json();if(!j.length)throw Error('找不到地点：'+q);return {name:j[0].display_name,lat:+j[0].lat,lon:+j[0].lon}}
function clear(){layers.forEach(x=>map.removeLayer(x));layers=[]}
function addLine(coords,i){const line=L.polyline(coords,{weight:7,opacity:.78,dashArray:document.getElementById('mode').value==='demo'?'10 8':null}).addTo(map);layers.push(line);return line}
async function otpPlan(a,b){const endpoint=document.getElementById('otp').value.trim();if(!endpoint)throw Error('请填写 OTP GraphQL 地址');
const query=`query($from:InputCoordinates!,$to:InputCoordinates!,$date:Date,$time:LocalTime){plan(from:$from,to:$to,date:$date,time:$time,numItineraries:1,transportModes:[{mode:TRANSIT},{mode:WALK}]){itineraries{duration startTime endTime legs{mode startTime endTime from{name} to{name} route{shortName longName} legGeometry{points}}}}}`;
const dt=window.__legDepart||new Date(); const date=dt.toISOString().slice(0,10); const time=dt.toTimeString().slice(0,8);
const r=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query,variables:{from:{lat:a.lat,lon:a.lon},to:{lat:b.lat,lon:b.lon},date,time}})});const j=await r.json();if(j.errors)throw Error(j.errors[0].message);return j.data.plan.itineraries[0]}
function decode(s){let pts=[],i=0,lat=0,lng=0;while(i<s.length){let b,shift=0,res=0;do{b=s.charCodeAt(i++)-63;res|=(b&31)<<shift;shift+=5}while(b>=32);lat+=(res&1)?~(res>>1):(res>>1);shift=0;res=0;do{b=s.charCodeAt(i++)-63;res|=(b&31)<<shift;shift+=5}while(b>=32);lng+=(res&1)?~(res>>1):(res>>1);pts.push([lat/1e5,lng/1e5])}return pts}
document.getElementById('plan').onclick=async()=>{const status=document.getElementById('status'),result=document.getElementById('result');try{status.textContent='正在查找地点…';const qs=[...stopsEl.querySelectorAll('input')].map(x=>x.value.trim()).filter(Boolean);if(qs.length<3)throw Error('至少输入起点、1 个途经点和终点');const ps=[];for(const q of qs)ps.push(await geocode(q));clear();let all=[];ps.forEach((p,i)=>{const m=L.marker([p.lat,p.lon]).addTo(map).bindPopup(String.fromCharCode(65+i)+' · '+qs[i]);layers.push(m);all.push([p.lat,p.lon])});let html='';const raw=document.getElementById('depart').value; window.__legDepart=raw?new Date(raw):new Date(); const dwell=Math.max(0,+document.getElementById('dwell').value||0);for(let i=0;i<ps.length-1;i++){ status.textContent=`正在规划第 ${i+1}/${ps.length-1} 段…`;if(document.getElementById('mode').value==='demo'){addLine([[ps[i].lat,ps[i].lon],[ps[i+1].lat,ps[i+1].lon]],i);html+=`<div class="leg"><b>${String.fromCharCode(65+i)} → ${String.fromCharCode(66+i)}</b> <span class="badge">演示</span><br>${qs[i]} → ${qs[i+1]}</div>`}else{const it=await otpPlan(ps[i],ps[i+1]);let coords=[];it.legs.forEach(l=>{if(l.legGeometry?.points)coords.push(...decode(l.legGeometry.points))});addLine(coords,i);html+=`<div class="leg"><b>${String.fromCharCode(65+i)} → ${String.fromCharCode(66+i)}</b> · ${Math.round(it.duration/60)} 分钟<br>${it.legs.map(l=>`<span class="badge">${l.route?.shortName||l.mode}</span>`).join(' ')}</div>`; if(it.endTime){window.__legDepart=new Date(+it.endTime); window.__legDepart=new Date(window.__legDepart.getTime()+dwell*60000)}}}
result.innerHTML=html;const group=L.featureGroup(layers);map.fitBounds(group.getBounds().pad(.12));status.textContent='完成：所有分段已叠加在同一张地图。'}catch(e){status.textContent='';result.textContent='错误：'+e.message}}
</script></body></html>
